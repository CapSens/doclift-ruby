version: 2.1

orbs:
  ruby: circleci/ruby@2.0.1

jobs:
  spec:
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
    steps:
      - checkout
      - ruby/install-deps:
          bundler-version: 2.7.2
          path: "$GEM_HOME"
          with-cache: false
      - run:
          name: "Run RSpec test suite"
          command: "bundle exec rake spec"

workflows:
  version: 2
  test:
    jobs:
      - spec:
          matrix:
            parameters:
              ruby-version: ["3.1", "3.4"]
